[package]
name = "might-reaper"
version = "0.1.0"
edition = "2024"
description = "Stops idle Claude Desktop workers, Gradle/Kotlin daemons and Plasma Discover to free memory"
license = "MIT"
repository = "https://github.com/Migiht/might-reaper"
readme = "README.md"
keywords = ["claude", "gradle", "memory", "daemon"]
categories = ["command-line-utilities"]

[dependencies]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
